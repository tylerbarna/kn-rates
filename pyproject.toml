[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knrates"
version = "0.1.0"
description = "Injection-recovery kilonova rate limits, selection criteria, and snapshot analysis for 8 years of ZTF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipykernel>=6.28",
]

[tool.setuptools.packages.find]
include = ["knrates*", "telemetry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["defunct", ".git", "__pycache__", "results", "logs"]
